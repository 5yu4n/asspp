name: SAP iOS IPA

# Temporary branch-only diagnostic: credential-free probe of Apple's
# authentication endpoints. Sends no Apple ID, password or code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Apple auth endpoints without credentials
        shell: python3 {0}
        run: |
          import re, time, urllib.request, urllib.error
          UA = "Configurator/2.17 (Macintosh; OS X 15.2; 24C5089c) AppleWebKit/0620.1.16.11.6"
          ITUNES_UA = "iTunes/12.13 (Macintosh; OS X 15.2) AppleWebKit/620.1.16"
          GUID = "0A1B2C3D4E5F"
          KEEP = ("x-responding-instance", "apple-originating-system", "location", "content-type", "x-apple-jingle-correlation-key")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          opener = urllib.request.build_opener(NoRedirect)
          def call(method, url, ua, body=None):
              req = urllib.request.Request(url, data=body, method=method, headers={"User-Agent": ua, "Content-Type": "application/x-apple-plist"})
              try:
                  r = opener.open(req, timeout=30); code, hdrs, data = r.status, r.headers, r.read()
              except urllib.error.HTTPError as e:
                  code, hdrs, data = e.code, e.headers, e.read()
              h = {k: hdrs.get(k) for k in KEEP if hdrs.get(k)}
              snippet = re.sub(r"\s+", " ", data[:300].decode("utf-8", "replace"))
              print(f"{method} {url} [{ua.split('/')[0]}] -> {code} {h} body[{len(data)}]: {snippet}")
              return code, data
          for ua in (UA, ITUNES_UA):
              _, bag = call("GET", f"https://init.itunes.apple.com/bag.xml?guid={GUID}", ua)
              m = re.search(rb"<key>authenticateAccount</key>\s*<string>([^<]+)</string>", bag)
              print("  authenticateAccount:", m.group(1).decode() if m else None)
          empty = b'<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict/></plist>'
          targets = [
              "https://buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/authenticate/",
              "https://buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/authenticate",
              f"https://buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/authenticate/?guid={GUID}",
              "https://auth.itunes.apple.com/auth/v1/native/fast",
          ]
          for round_ in range(3):
              print(f"--- round {round_ + 1}")
              for t in targets:
                  call("POST", t, UA, empty)
              time.sleep(5)
