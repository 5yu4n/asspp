name: SAP iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
              *beta*|*_rc*) continue ;;
            esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          if [ -n "$best_path" ]; then
            echo "Selected Xcode $best_ver at $best_path"
            sudo xcode-select -s "$best_path"
          fi
          xcodebuild -version
      - name: Ensure iOS platform is installed
        run: |
          if ! xcodebuild -showsdks | grep -q iphoneos; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Prepare verified local SAP runtime
        run: python3 Resources/Scripts/prepare.sap.runtime.py --public-certificates
      - name: Install build formatter
        run: brew install xcbeautify
      - name: Verify local WebView signer without credentials
        env:
          ASSPP_TEST_APPLE_SAP: "1"
        run: bash Resources/Scripts/check.sap.webview.sh
      - name: Compile iOS IPA
        run: ./Resources/Scripts/compile.release.mobile.ci.sh "$PWD" "$RUNNER_TEMP/Asspp-SAP.ipa"
      - name: Verify IPA
        run: python3 Resources/Scripts/verify.sap.ipa.py "$RUNNER_TEMP/Asspp-SAP.ipa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Asspp-SAP-IPA
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/Asspp-SAP.ipa
            ${{ runner.temp }}/Asspp-SAP.ipa.sha256
